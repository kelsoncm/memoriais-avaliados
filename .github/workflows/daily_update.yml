name: Atualização Diária e Deploy RSC-TAE

on:
  schedule:
    # Executa diariamente às 02:00 UTC (23:00 Horário de Brasília)
    - cron: '0 2 * * *'
  workflow_dispatch: # Permite execução manual pelo painel do GitHub Actions
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'docs/**'
      - '.github/workflows/daily_update.yml'
      - 'requirements.txt'

# Concorrência para evitar builds simultâneos
concurrency:
  group: 'rsc-tae-pages'
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  etl:
    name: Coleta, Processamento & Validação
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Coleta de Dados (SUAP API)
        id: collect
        run: |
          python src/collect.py --timeout 180 --max-retries 4

      - name: Processar e Anonimizar Dados
        run: |
          python src/process.py

      - name: Validar Integridade e Regras de Privacidade (LGPD)
        run: |
          python src/validate.py

      - name: Commit e Push dos Dados Atualizados
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Adiciona apenas dados anonimizados e agregados em docs/data/
          git add docs/data/
          
          if git diff --staged --quiet; then
            echo "Nenhuma alteração nos dados detectada. Nada a commitar."
          else
            git commit -m "chore(data): atualização automática dos dados de RSC-TAE [skip ci]"
            git push origin main
          fi

  deploy:
    name: Deploy GitHub Pages (Jekyll)
    needs: etl
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Ruby e Jekyll
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build do Site Jekyll
        run: |
          cd docs
          bundle init || true
          bundle add jekyll jekyll-feed jekyll-seo-tag jekyll-sitemap || true
          bundle exec jekyll build --destination ../_site

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
